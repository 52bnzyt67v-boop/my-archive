.record-summary{background:#f7f7f7;border-radius:13px;padding:13px 14px;font-size:12px;color:#717171;line-height:1.8}.chipgroup{margin-top:8px}.card .section-title{letter-spacing:-.025em}

/* =======================================================
   v0.8 — THE EDITORIAL EDITION
   Redesign only. Original state key, events and functions
   are preserved. Black/white + pastel mood annotations.
   ======================================================= */
:root {
  --ink:#171717; --muted:#878787; --line:#e2e2e2; --bg:#fcfcfc; --card:#ffffff;
  --green:#212121; --pink:#dedede; --yellow:#e4e4e4; --blue:#dddddd; --mint:#e4e4e4; --lav:#dedede;
  --editorial-sans:'DM Sans','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --editorial-serif:'Italiana','Cormorant Garamond','Bodoni MT','Didot',Georgia,serif;
}
html {scroll-behavior:smooth}
body {background:#e9e9e9;color:var(--ink);font-family:var(--editorial-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.018em}
button,input,textarea,select{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #171717;outline-offset:3px}
#app {max-width:540px;min-height:100dvh;background:var(--bg);box-shadow:0 0 65px #1616160b;padding-bottom:98px;position:relative}
.top {padding:30px 29px 21px;align-items:flex-start;border-bottom:1px solid #e9e9e9;background:var(--bg);gap:14px}
.header-lockup {display:flex;align-items:center;gap:13px;min-width:0}
.archive-monogram {width:39px;height:39px;flex:none;display:grid;place-items:center;border:1.3px solid #1b1b1b;border-radius:50%;font-family:var(--editorial-serif);font-size:29px;line-height:1;letter-spacing:-.09em;padding:0 3px 3px 0;position:relative}
.mono-period{font-size:16px;margin-left:1px;position:absolute;right:9px;bottom:5px}
.brand-copy{min-width:0}
.eyebrow {font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.21em;font-weight:600;color:#8d8d8d}
.top .eyebrow{font-size:8px;letter-spacing:.135em;color:#929292;white-space:nowrap}
.heading {font-family:var(--editorial-serif);font-size:27px;font-weight:400;letter-spacing:-.04em;line-height:1.02;margin:6px 0 2px;color:#1b1b1b}
.brand-subtitle{font-size:7px;letter-spacing:.135em;font-weight:600;color:#adadad;margin-top:6px;white-space:nowrap}
.settings-trigger{flex:none;width:35px;height:35px;border:1px solid #dcdcdc;border-radius:50%;background:transparent;color:#222222;transition:transform .22s,background .22s}
.settings-trigger:hover{transform:rotate(25deg);background:#f4f4f4}
.section{padding:23px 25px}
.section-title{font-size:13px;letter-spacing:-.035em;font-weight:600;color:#1e1e1e}
.muted,.hint,.empty{color:#8d8d8d}
.card,.settings-hero,.mini-panel,.collection-card,.archive-preview,.ai-generated,.box-quiet,.feature-note,.warn,.record-summary{background:#ffffff;border:1px solid #e7e7e7;border-radius:3px;box-shadow:none}
.card{padding:18px}
.card+.card{margin-top:12px}
.primary,.detail-add{border:1px solid #181818;background:#181818;color:#ffffff;border-radius:2px;font-size:12px;font-weight:600;letter-spacing:.015em;transition:background .2s,transform .2s}
.primary:hover,.detail-add:hover{background:#3b3b3b;transform:translateY(-1px)}
.outline,.pill{background:transparent;border:1px solid #dcdcdc;border-radius:2px;color:#323232;font-size:11px;font-weight:500}
.outline:hover,.pill:hover{border-color:#222222;background:#f8f8f8}
.nav {background:#ffffffed;backdrop-filter:blur(20px);width:min(540px,100%);padding:13px 13px max(16px,env(safe-area-inset-bottom));border-top:1px solid #e5e5e5;gap:2px}
.nav button{color:#969696;flex:1;padding:7px 1px 0;font-size:9px;letter-spacing:.075em;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:7px}
.nav button.active {color:#171717;font-weight:700}
.nav button.active .nav-text::after{content:"";display:block;height:1px;background:#1f1f1f;margin-top:3px}
.nav .sym{font-size:0;height:21px;display:grid;place-items:center}
.nav svg{width:19px;height:19px}
.quick-add{bottom:96px;left:auto;right:max(calc((100vw - 540px)/2 + 25px),25px);width:55px;height:55px;background:#171717;color:#ffffff;border:0;border-radius:50%;font-family:var(--editorial-sans);font-size:29px;font-weight:300;line-height:1;box-shadow:0 9px 22px #17171720;transition:transform .2s,box-shadow .2s}
.quick-add:hover{transform:translateY(-3px) rotate(90deg);box-shadow:0 12px 28px #17171728}
/* Calendar — one editorial spread, ruled like a journal */

.calendar-v062 .calgrid{gap:0;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #1e1e1e;border-left:1px solid #e5e5e5}
.calendar-v062 .weekday {font-size:9px;letter-spacing:.10em;font-weight:700;color:#999999;padding:15px 0 14px;border-right:1px solid #e5e5e5;border-bottom:1px solid #dadada;background:transparent}
.calendar-v062 .weekday:first-child {color:#9d9d9d}
.calendar-v062 .day,.calendar-v062 .day:hover{border:0;border-right:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;border-radius:0;box-shadow:none;background:transparent;min-height:83px;padding:10px 3px 7px;gap:10px;align-items:center;justify-content:flex-start;transition:background .2s;color:#242424}

/* My Archive v0.9 — THE STUDIO EDITION: experimental editorial art direction */
:root{--ink:#151515;--muted:#858585;--line:#e5e5e5;--bg:#fbfbfb;--card:#ffffff;--editorial-serif:'Instrument Serif','Bodoni MT','Times New Roman',Georgia,serif;--editorial-sans:'DM Sans','Inter','Noto Sans KR','Malgun Gothic',sans-serif}
body{background:#dedede;color:#171717;font-family:var(--editorial-sans)}
#app{background:#fbfbfb}
/* The new identity: museum publication + a private, slightly playful journal */
.top{background:#fbfbfb;border-bottom:1px solid #e7e7e7}
.archive-monogram{border:1.5px solid #1c1c1c;font-family:var(--editorial-serif);font-size:32px;transform:rotate(-8deg);padding-bottom:5px}

/* Header typography as artwork, without interfering with navigation. */

/* Actual Settings art direction: first come calendar choices; preferences live on paper. */

.studio-setting-head{position:relative;padding:17px 0 38px;border-top:1px solid #1b1b1b;border-bottom:1px solid #dedede;overflow:hidden}

/* --------------------------------------------------------------
   MY ARCHIVE 1.0 / NOIR — cold monochrome editorial system
   No card-fied warmth, no playful ornaments, no chromatic palette.
   Original application state, storage keys and behavior unchanged.
   -------------------------------------------------------------- */
:root{
 --ink:#0d0f12;--muted:#686d75;--line:#d9dde2;--bg:#fff;--card:#fff;
 --editorial-serif:'Inter Tight','Arial Narrow','Arial',sans-serif;
 --editorial-sans:'Inter Tight','Inter','Arial','Noto Sans KR','Malgun Gothic',sans-serif;
 --cool:#f3f5f7;--cool2:#e9ecef;--deep:#0b0d10;
}
html{background:#e7e9ec;color-scheme:light}
body{background:#e7e9ec;color:var(--ink);font-family:var(--editorial-sans);font-size:14px;-webkit-font-smoothing:antialiased}
#app{background:#fff;box-shadow:0 0 0 1px #c9ced5;}
#view{background:#fff;color:var(--ink)}
button,input,textarea,select{font-family:var(--editorial-sans)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #16191e!important;outline-offset:3px}
:where(.card,.box-quiet,.mini-panel,.collection-card,.composer-panel,.day-detail-sheet,.search,.outline,.tabs,.pill,.tag,.chip,.warn,.feature-note,.studio-tech-card,.record-summary){border-radius:0!important;box-shadow:none}
.card{background:#fff;border-color:#dfe2e6;padding:20px}
.card+.card{margin-top:14px}
.section{padding:22px 24px}
.eyebrow{font:500 10px/1.4 'Inter Tight','Helvetica Neue',Arial,sans-serif;letter-spacing:.12em;color:#727781;text-transform:uppercase}
.heading{font-family:var(--editorial-sans);font-size:23px;font-weight:800;letter-spacing:-.07em;line-height:.94;text-transform:uppercase}
.brand-subtitle{color:#888e97;font:500 9px 'Inter Tight','Helvetica Neue',Arial,sans-serif;letter-spacing:.055em;text-transform:uppercase}
.muted,.hint,.empty{color:#757a83}
.section-title{font-size:15px;letter-spacing:-.035em;font-weight:760}
.small-title{font-weight:730}
.card .section-title{letter-spacing:-.025em}
.top{background:#fff;border-bottom:1px solid #d7dce1}
.archive-monogram{background:#0b0d10!important;color:#fff!important;border:1px solid #0b0d10!important;border-radius:0!important;transform:none!important;font:800 17px/1 var(--editorial-sans)!important;letter-spacing:-.075em!important;display:flex;align-items:center;justify-content:center}
.archive-monogram .mono-period{font-size:inherit!important;color:#fff!important}
.settings-trigger{background:#fff!important;border:1px solid #bfc4cc!important;color:#0b0d10!important;border-radius:0!important;box-shadow:none!important}
.settings-trigger:hover{background:#0b0d10!important;color:#fff!important}
.nav{background:#fff;border-top:1px solid #d9dde3;box-shadow:none;backdrop-filter:none}
.nav button{font:600 9px 'Inter Tight','Helvetica Neue',Arial,sans-serif;letter-spacing:.01em;color:#8a8f97}
.nav button.active{color:#0b0d10;background:none}
.nav .sym{opacity:.8}
.nav button.active .nav-text::after{background:#0b0d10;transform:scaleX(1);height:1px}
.quick-add{width:52px;height:52px;bottom:83px;border:1px solid #0b0d10;border-radius:0!important;background:#0b0d10;color:#fff;box-shadow:0 9px 21px #0000001e!important;transform:none!important;font-family:'DM Sans',sans-serif;font-size:29px;font-weight:300}
.quick-add:hover{transform:translateY(-2px)!important;background:#282d34}
.primary{background:#0c0e12;border:1px solid #0c0e12;color:#fff;border-radius:0;font-size:12px;letter-spacing:.02em}
.primary:hover{background:#353a40}
.outline,.pill,.filter,.tool-button{background:#fff;border:1px solid #c7cbd2;color:#1d2127;border-radius:0}
.filter.active{background:#0b0d10;color:#fff;border-color:#0b0d10}
.tag,.chip,.insight-tag{background:#f1f3f5;color:#525860;border-radius:0;border-color:#dce0e4}
.tabs{background:#f2f4f6;border-radius:0}
.tabs button{color:#6c737c;border-radius:0}
.tabs button.active{color:#090b0f;background:#fff;box-shadow:inset 0 -2px 0 #11151a}
.entry,.task,.transaction,.archive-row{border-color:#e1e4e8}
.task input, input[type=checkbox]{accent-color:#0c0e12}
.task-name,.archive-row strong{color:#15181d}
.box-quiet,.feature-note,.record-summary{background:#f3f5f7;color:#626870}
.warn{background:#f2f4f6;border:1px solid #d7dce2;color:#3f454c}
.search{background:#fff;border-color:#cbd0d6;color:#17191e}
.search::placeholder{color:#a6abb2}
.tree-row{color:#272e35;border-color:#e2e5e9}
.tree-row.active{background:#f2f4f6;border-radius:0}
.tree-indented{border-left-color:#d6dbe0}
.collection-card{border-color:#dce0e6;color:#21252a}
.collection-card span,.analysis-details summary,.ai-label{color:#686f78}
.mini-panel{background:#f6f7f9;border-color:#e2e5e9}
.status-pending,.status-ok,.status-rejected{color:#272d34;background:#eef0f2}
.tiny-action{color:#151a20;border-color:#d0d5db;border-radius:0}
.notice-small,.settings-footnote{color:#737982}

/* CALENDAR / oversized typographic grid, one confident image system */
.calendar-v062{background:#fff;padding:28px 24px 75px}
.calendar-kicker{border-color:#16191d;color:#444a52;font:500 9px 'Inter Tight','Helvetica Neue',Arial,sans-serif;letter-spacing:.07em;padding:2px 0 16px}

.calendar-v062 .calendar-month-center .eyebrow{font:500 10px 'Inter Tight','Helvetica Neue',Arial,sans-serif;letter-spacing:.06em;color:#7b8088}
.calendar-v062 .calendar-month-center h2{margin:12px 0 21px;line-height:.88;overflow:visible}
.calendar-v062 .month-typography{font:800 clamp(57px,14.3vw,90px)/.89 var(--editorial-sans);letter-spacing:-.087em;text-transform:uppercase;color:#0b0c0f;white-space:nowrap;display:block;transform-origin:left}

.calendar-v062 .calendar-year{color:#16191d;font:500 11px 'Inter Tight','Helvetica Neue',Arial,sans-serif;letter-spacing:.065em}

.calendar-v062 .month-caption{font:500 9px/1.5 'Inter Tight','Helvetica Neue',Arial,sans-serif;letter-spacing:.06em;color:#78808a;text-transform:uppercase;font-style:normal;white-space:normal;max-width:190px;text-align:right}

 const folderIDs=new Set(),folderIndex=new Map();for(const f of state.v91Folders||[]){
  if(folderIDs.has(f.id))issues.push('Duplicate folder ID: '+f.id);
  folderIDs.add(f.id);folderIndex.set(f.id,f);
 }
 for(const f of state.v91Folders||[]){let cursor=f,seen=new Set();while(cursor&&cursor.parentId){
  if(seen.has(cursor.id)){issues.push('Folder cycle: '+f.id);break}seen.add(cursor.id);
  const parent=folderIndex.get(cursor.parentId);if(!parent){issues.push('Missing parent folder for: '+f.id);break}
  if(parent.archiveId!==f.archiveId){issues.push('Folder parent crosses collections: '+f.id);break}cursor=parent;

function v90CreateFromQuick(type){
 if(type==='collection'){type='archive:'+ (state.editArchiveId||orderedEnabled().find(x=>isStructuredType(x.id))?.id||'reading')}
 if(type==='folder'&&!(state.view==='archive'&&state.archive)){const chooser=document.getElementById('v91FolderChooser');if(chooser){chooser.hidden=false;chooser.querySelector('select')?.focus()}return}
 const folderTarget=type==='folder-selected'?document.getElementById('v91FolderTarget')?.value:'';
 const chosen=type==='selected-collection'?document.getElementById('v90CollectionSelect')?.value:'';
 v90DismissQuickMenu();
 if(type==='field'&&state.view==='typeEditor'){draftType.fields.push({id:uid(),name:'',type:'text'});renderTypeEditor();return}
 if(type==='entry'){openComposer();return}
 if(type==='task'){v82AddTask();return}
 if(type==='expense'){v82AddTransaction();return}
 if(type==='schedule'){showActivityEditor('__new__');return}
 if(type==='emotion'){openMoodEditor(state.selected);return}
 if(type==='period'){v87OpenPeriodEditor('',state.selected);return}
 if(type==='custom'){openTypeEditor();return}
 if(type==='folder'||type==='folder-selected'){const id=type==='folder-selected'?folderTarget:(state.view==='archive'&&state.archive?ARCHIVE_DEFS.find(x=>x.name===state.archive)?.id:orderedEnabled().find(x=>isStructuredType(x.id))?.id);if(id){if(state.view!=='archive'||state.archive!==archiveDef(id).name)set({view:'archive',archive:archiveDef(id).name});v91OpenFolderManager(id)}return}
 if(type.startsWith('archive:')){const id=type.slice(8),def=archiveDef(id);if(!def)return;if(id==='mood'){openMoodEditor(state.selected);return}if(id==='period'){v87OpenPeriodEditor('',state.selected);return}if(id==='finance'){v82AddTransaction();return}if(!isStructuredType(id)){openComposer();return}openItemEditor(id);return}
 if(type==='selected-collection'&&chosen){openItemEditor(chosen);return}
}

 content+=`<section class="studio-setting-group"><div class="studio-group-title">YOUR DATA, YOURS.</div><div class="studio-foot-row"><strong>기록 백업과 가져오기</strong></div><p class="settings-footnote">기록은 현재 이 브라우저에만 보관됩니다. 중요한 기록은 백업 파일을 따로 저장해 두는 게 좋아.</p><div class="archive-storage-audit"><div class="archive-storage-audit-top"><strong>LOCAL STORAGE</strong><b>${storageSummary.pretty}</b></div><div class="archive-storage-audit-track"><span style="width:${Math.min(100,Math.round(storageSummary.bytes/(4*1024*1024)*100))}%"></span></div><div class="archive-storage-audit-meta">${storageSummary.entries} ENTRIES · ${storageSummary.photos} ATTACHMENTS · ${storageSummary.manual} MANUAL BLOCKS</div><div class="archive-storage-audit-meta" style="margin-top:8px;font-weight:750">PHOTO VAULT · ${vaultStatus} · ${photoRefSources.size} FILES</div>${photoVaultProblem?`<p class="archive-storage-warning">${safe(photoVaultProblem)}</p>`:''}${storageSummary.bytes>2.5*1024*1024?'<p class="archive-storage-warning">BACKUP RECOMMENDED — 이 브라우저 저장 용량에 가까워질 수 있습니다.</p>':''}<p class="archive-storage-disclaimer">표시 크기는 localStorage 데이터의 추정치야. 사진 원본은 가능한 경우 별도 IndexedDB에 저장됩니다. 동일 브라우저·출처에서만 자동으로 이어지므로 JSON 백업을 외부에 꼭 보관하십시오.</p></div><div class="studio-vault-audit"><div class="studio-vault-heading">PHOTO VAULT AUDIT</div><div class="studio-vault-actions"><button type="button" id="checkPhotoVault" class="outline">CHECK PHOTOS</button><button type="button" id="saveUnusedPhotos" class="outline" disabled>SAVE UNUSED</button><button type="button" id="removeUnusedPhotos" class="outline danger" disabled>REMOVE UNUSED</button><label class="outline vault-restore-label" for="restoreUnusedInput">RESTORE COPY<input id="restoreUnusedInput" type="file" accept=".json,application/json" style="display:none"></label></div><p class="archive-backup-result" id="photoVaultAuditResult" aria-live="polite">Check the photo vault before removing unreferenced images.</p><p class="vault-audit-note">Cleanup never runs automatically. Download and verify the rescue file before removing unused photos. Keep your complete JSON backup separately.</p></div><div class="v58-backup-panel"><div class="studio-tech-kicker">COMPLETE ARCHIVE / BACKUP SAFETY</div><h3>FULL BACKUP FIRST</h3><p>원본·사진·수동 확정 정보·검토 이력을 포함하는 전체 백업을 사용해. 표준 기록 JSON은 전체 복원용이 아닙니다.</p><p id="backupExportStatus" class="record-import-report" aria-live="polite">${fullBackupStatusText()}</p><div class="v58-backup-actions"><button type="button" id="previewFullBackup" class="outline">CHECK FULL BACKUP CONTENTS</button></div><div id="fullBackupReport" class="record-import-report" aria-live="polite">미리보기는 확정된 데이터를 수정하지 않습니다.</div></div><div class="v59-snapshot"><div class="studio-tech-kicker">LOCAL RECOVERY / OPTIONAL</div><h3>AUTO SNAPSHOTS</h3><p>설정하면 앱이 열려 있고 변경 내용이 있을 때 최소 1시간 간격으로 사진·확정 정보까지 포함한 전체 사본을 브라우저 내부에 보관해. 최근 4개만 유지해.</p><div class="v59-controls"><button id="toggleAutoSnapshot" type="button" class="outline">${autoSnapshotEnabled?'TURN AUTO OFF':'ENABLE LOCAL AUTO'}</button><button id="createSnapshotNow" type="button" class="outline">SNAPSHOT NOW</button><button id="refreshSnapshotList" type="button" class="outline">REFRESH LIST</button></div><p id="snapshotStatus" class="v59-status">Checking browser storage…</p><div id="snapshotList" aria-live="polite"></div><p>브라우저 데이터 삭제·기기 변경 시 스냅샷도 사라질 수 있습니다. 자동 실행은 앱이 열려 있을 때만 가능해. SAVE FILE로 다운로드한 전체 JSON을 별도 위치에도 보관해.</p></div><div class="v68-audit"><div class="studio-tech-kicker">VERSION 6.8 / BACKUP READINESS</div><h3>MOVE WITH CARE.</h3><p>새 HTML 파일로 넘어가기 전 원본·사진·확정 감정·자정 넘김 일정을 검사해. 이 진단은 읽기 전용이야.</p><div class="studio-backup-row"><button type="button" class="outline" id="checkUpgradeV68">CHECK MY DATA</button></div><p id="v68Readiness" class="archive-backup-result" aria-live="polite">CHECK MY DATA를 눌러 현재 기록의 이전 준비 상태를 확인해.</p><p>같은 기기라도 HTML 경로가 달라지면 브라우저 저장소가 공유되지 않을 수 있습니다. 반드시 이전 버전에서 전체 백업 JSON을 별도 폴더에 보관한 후 새 버전에서 백업을 검사·복원해.</p></div><section class="v78-transfer" aria-labelledby="v78Title">
<div class="studio-tech-kicker">VERSION 7.8 / TRANSFER VALIDATION</div><h3 id="v78Title">TRANSFER PROOF.</h3>
<p><b>원본 백업과 새 앱의 기록이 정말 같은지</b> 내용별 SHA-256으로 비교해. 원본 일기·사진·승인된 감정·컬렉션·거래 등 26개 보존 영역을 검사하며 화면 상태나 검색 필터는 비교에서 제외해.</p>
<div class="v78-steps">
<div class="v78-step"><h4>01 — SOURCE BACKUP</h4><p>기존 앱에서 내려받은 FULL BACKUP JSON을 선택해 읽기 전용으로 검사하고, 개인 기록 내용이 없는 확인용 영수증을 만들어.</p>
<div class="v78-btns"><label for="v78SourceInput">CHECK SOURCE JSON<input type="file" id="v78SourceInput" accept=".json,application/json"></label><button type="button" id="v78DownloadReceipt" disabled>DOWNLOAD RECEIPT</button></div></div>
<div class="v78-step"><h4>02 — NEW APP</h4><p>새 HTTPS 앱에서 기존 방식으로 복원한 뒤 영수증을 불러와 현재 기록과 비교해. 비교만으로 데이터가 교체되지는 않습니다.</p>
<div class="v78-btns"><label for="v78ReceiptInput">LOAD RECEIPT<input type="file" id="v78ReceiptInput" accept=".json,application/json"></label><button type="button" id="v78Compare" disabled>COMPARE CURRENT</button></div></div>
</div>
<p class="v78-message" id="v78Message" role="status" aria-live="polite">기존 전체 백업을 선택하거나, 다른 기기에서 저장한 검증 영수증을 불러오십시오. 이 도구는 데이터를 복원하거나 병합하지 않습니다.</p>
<div class="v78-results" id="v78Results" aria-live="polite"></div>
<p>영수증은 파일 원본이 아니라 <b>무작위 소금값(salt)을 사용한 SHA-256 해시·개수</b>를 담아. 모든 필드가 같다는 결론은 지정된 보존 영역에만 적용되며 실제 사진 표시·기기 간 동기화·장기 보존까지 증명하는 것은 아닙니다.</p>
</section><section class="v77-launch" aria-labelledby="v77Title">
<div class="studio-tech-kicker">VERSION 7.7 / READY TO DEPLOY?</div><h3 id="v77Title">LAUNCH READINESS.</h3>
<p>배포·이전 전에 <b>저장소 기능, 전체 백업의 복원 가능성, 설치형 앱의 캐시 상태</b>를 따로 검사해. 시험 데이터는 별도 임시 저장소에만 기록하고, 일기·사진·확정 판단은 수정하지 않습니다.</p>
<div class="v77-buttons"><button type="button" id="v77RunAll">RUN ALL CHECKS</button><button type="button" id="v77StorageTest">TEST STORAGE</button><button type="button" id="v77BackupTest">REHEARSE BACKUP</button><button type="button" id="v77PWATest">CHECK PWA SHELL</button><button type="button" id="v77Report" disabled>DOWNLOAD SAFE REPORT</button></div>
<div class="v77-results" id="v77Results" role="status" aria-live="polite">
<div class="v77-check-row"><div><strong>STORAGE WRITE / READ / CLEANUP</strong><p>일기 데이터와 분리된 테스트 키·임시 IndexedDB를 사용해.</p></div><span class="v77-check-status na">NOT RUN</span></div>
<div class="v77-check-row"><div><strong>FULL BACKUP REHEARSAL</strong><p>메모리에서 전체 백업 생성→SHA-256 확인→복원 전 검사만 실행해. 실제 복원은 하지 않습니다.</p></div><span class="v77-check-status na">NOT RUN</span></div>
<div class="v77-check-row"><div><strong>INSTALLATION & OFFLINE SHELL</strong><p>HTTPS·manifest·서비스 워커·오프라인 캐시를 살펴봐. 설치·비행기 모드 실행까지 보장하는 검사는 아닙니다.</p></div><span class="v77-check-status na">NOT RUN</span></div>
</div><p class="v77-bottom" id="v77Summary">검사 실행 전이야. 검사 통과와 장기 데이터 보존은 서로 다른 문제이므로, 실제 기기에서 전체 백업 복원도 확인해야 해.</p>
<p class="v77-detail">보고서에는 진단 상태·기록 개수·백업 검사 정보만 포함하고 <b>일기 원문, 사진, 감정 내용, 클라우드 자격증명은 넣지 않습니다.</b> IndexedDB 테스트가 제한된 환경에서는 정상으로 표시하지 않습니다.</p>
</section><section class="v76-transfer" aria-labelledby="v76TransferTitle"><div class="studio-tech-kicker">VERSION 7.6 / INSTALLATION HANDOFF</div><h3 id="v76TransferTitle">MOVE WITHOUT LOSING.</h3><p>단일 HTML 파일과 HTTPS 설치형 앱은 저장 위치가 다를 수 있습니다. 자동 복사·병합이 아니라 기존의 검증된 FULL JSON 경로로 이전해.</p><ol><li><b>기존 앱:</b> CHECK SOURCE로 기록·사진 참조를 확인하고 FULL BACKUP을 외부 저장소에 다운로드</li><li><b>설치형 앱:</b> 동일한 백업 JSON을 CHECK BACKUP에서 검사 (읽기 전용)</li><li><b>검사 완료 후:</b> RESTORE VERIFIED FILE을 직접 선택해 현재 앱의 기록을 교체</li><li><b>복원 후:</b> RESTORE WITH PROOF·PHOTO VAULT AUDIT 및 이전/이후 전체 백업 비교 확인</li></ol><div class="v76-transfer-buttons"><button type="button" id="v76CheckOrigin">CHECK SOURCE</button><button type="button" id="v76Export">DOWNLOAD FULL BACKUP</button><button type="button" id="v76ChooseFile">CHECK BACKUP JSON</button><input type="file" id="v76TransferFile" accept=".json,application/json"><button type="button" id="v76ApplyFile" class="primary" disabled>RESTORE VERIFIED FILE</button></div><p class="v75-status" id="v76TransferStatus" role="status">두 환경에서 각각 이 절차를 진행해야 해. 이 기능은 클라우드 동기화나 자동 이전을 하지 않습니다.</p><p>개인 기록과 사진이 포함된 백업 JSON은 암호화되지 않았어. 외부에 공유하지 말고 안전하게 보관해.</p></section><section class="v71-external"><div class="studio-tech-kicker">VERSION 7.1–7.2 / FULL EXTERNAL BACKUP</div><h3>BACK UP OUTSIDE THE APP.</h3><p>지원 브라우저에서는 <b>사용자가 선택한 기기 폴더</b>에 사진·확정 감정·컬렉션·거래·검토 이력까지 포함한 FULL JSON을 저장하고 다시 읽어 검증해. 동의 없이 파일에 접근하지 않습니다.</p><div class="v71-controls"><button type="button" class="outline" id="v71Connect">CONNECT BACKUP FOLDER</button><button type="button" class="outline" id="v71SaveNow">SAVE VERIFIED COPY</button><button type="button" class="outline" id="v71ToggleAuto">AUTO WHEN OPEN: OFF</button><button type="button" class="outline" id="v71Refresh">CHECK STATUS</button></div><div class="v71-report" id="v71BackupStatus" role="status" aria-live="polite">현재 저장 기능을 확인하는 중…</div><p>자동 저장은 <b>앱이 열려 있고, 변경 사항이 있으며, 연결한 폴더에 쓰기 권한이 유지된 경우</b>에만 최소 6시간 간격으로 실행됩니다. 앱을 닫은 동안에는 백업할 수 없습니다. 생성한 사본은 자동 삭제하지 않습니다.</p><div class="v71-fallback"><strong>iPhone·미지원 브라우저</strong><p>자동 폴더 저장이 불가능할 수 있습니다. 기존 FULL BACKUP 버튼으로 JSON을 내려받아 iCloud Drive 등의 별도 위치에 저장해. 이 앱은 iCloud에 직접 연결하거나 자동 업로드하지 않습니다.</p><button type="button" class="outline" id="v71ManualSave">DOWNLOAD FULL BACKUP</button></div><p class="v71-caution">백업 폴더가 같은 기기 내부라면 기기 고장에 대비한 원격 백업은 아닙니다. 클라우드 동기화 폴더를 선택하더라도 동기화 완료 여부는 해당 서비스에서 확인해야 해.</p></section><section class="v75-cache" aria-labelledby="v75Title"><div class="studio-tech-kicker">VERSION 7.5 / NON-DESTRUCTIVE PREVIEWS</div><h3 id="v75Title">PREVIEW CACHE.</h3><p>PHOTO CALENDAR·DAY FILE·기록 사진을 작은 미리보기로 표시하고 보이는 항목부터 불러와. 사진 원본은 기존 IndexedDB에 그대로 두고, 작은 미리보기만 <b>별도 캐시</b>에 저장해. 캐시는 전체 백업에 포함하지 않습니다.</p><div class="v75-buttons"><button type="button" id="v75CheckCache">CHECK CACHE</button><button type="button" id="v75WarmMonth">PREPARE THIS MONTH</button><button type="button" id="v75ClearCache">CLEAR PREVIEWS ONLY</button></div><div class="v76-limit"><label for="v76CapSelect">PREVIEW CACHE MAX</label><select id="v76CapSelect" aria-label="미리보기 캐시 최대 용량">${[32,64,128].map(m=>`<option value="${m}" ${v76LimitMB()===m?'selected':''}>${m} MB</option>`).join('')}</select><button type="button" id="v76TrimCache">TRIM CACHE NOW</button><span>최대 400장 / 오래된 캐시부터 정리</span></div><div class="v75-status" id="v75CacheStatus" role="status">캐시를 검사하거나 현재 표시 중인 달의 대표사진 미리보기를 미리 만들어 둘 수 있습니다. 캐시 삭제는 원본 사진·기록을 변경하지 않습니다.</div><p>사진 처음 열 때 작은 이미지를 만드는 데 잠시 시간이 들 수 있습니다. 상세 갤러리는 기존 원본을 사용해. 실제 저장 공간이 부족한 경우 캐시를 지워도 원본 보관 문제가 해결되지 않을 수 있으므로 FULL BACKUP을 먼저 확인해.</p></section><section class="v74-library" aria-labelledby="v74Title"><div class="studio-tech-kicker">VERSION 7.4 / READ-ONLY MEDIA INVENTORY</div><h3 id="v74Title">PHOTO SPACE AUDIT.</h3><p>일기 첨부사진과 날짜별 대표사진이 차지하는 <b>예상 용량·날짜별 분포·큰 이미지</b>를 확인해. 브라우저 전체 저장량과 사진 데이터량은 서로 다른 지표야. 자동 압축·삭제·기록 변경은 하지 않습니다.</p><div class="v74-actions"><button type="button" id="v74Scan">SCAN PHOTO SPACE</button><button type="button" id="v74Download" disabled>EXPORT CSV REPORT</button><button type="button" id="v74Cancel" disabled>STOP SCAN</button><button type="button" id="v74FullBackup">DOWNLOAD FULL JSON</button></div><div id="v74Report" class="v74-report" role="status" aria-live="polite">SCAN PHOTO SPACE를 눌러 현재 사진·브라우저 저장량을 조사해. 읽기 전용 검사야.</div><div id="v74Results" aria-live="polite"></div><p class="v74-note">사진 용량은 원본 데이터의 base64 길이로 추산하므로 저장소의 실제 사용량과 다를 수 있습니다. 용량 통계에 빠진 보관 사진·캐시·다른 출처 데이터가 있을 수 있습니다. 사진을 지우기 전에 사진까지 포함된 FULL BACKUP JSON과 복원 검증을 끝내는 것이 안전해.</p></section><section class="v73-restore" aria-labelledby="v73RestoreHeading"><div class="studio-tech-kicker">VERSION 7.3 / RESTORE VERIFICATION</div><h3 id="v73RestoreHeading">RESTORE WITH PROOF.</h3><p>복원할 FULL JSON을 먼저 <b>읽기 전용으로 검사</b>해. 백업의 SHA-256, 사진 데이터의 포함 여부, 중복 원본 ID, 연결 관계 및 현재 기록과의 교체 차이를 확인해. 파일 검사는 기록이나 사진을 수정하지 않습니다.</p><div class="v73-actions"><label class="v73-file">CHECK RESTORE FILE<input type="file" id="v73BackupFile" accept=".json,application/json"></label><button type="button" id="v73SaveAudit" class="outline" disabled>SAVE CHECK REPORT</button><button type="button" id="v73CheckCurrent" class="outline">CHECK CURRENT PHOTOS</button></div><div id="v73PreflightResult" class="v73-report" role="status" aria-live="polite">복원하려는 전체 백업 JSON을 선택해. 검사만으로 데이터가 바뀌지는 않습니다.</div><div id="v73LastRestoreResult" class="v73-previous">아직 이번 버전에서 복원 후 저장 일치 검사를 진행하지 않았어.</div><p>실제 가져오기는 아래의 <b>백업 가져오기</b>에서 별도로 진행하며, 기존 기록을 병합하지 않고 교체해. 복원 직후에는 브라우저 저장값과 IndexedDB의 사진 참조를 재확인해. 이 검사는 사진의 시각적 디코딩이나 장기 보존을 보장하지 않습니다.</p></section><section class="v72-recovery"><div class="studio-tech-kicker">VERSION 7.2 / STORAGE RELIABILITY</div><h3>VERIFY. RECOVER. KEEP.</h3><p>사진이 화면에 보이는 것만으로 원본 파일이 안전하게 저장됐다고 판단하지 않습니다. 현재 기록의 사진 참조를 IndexedDB에서 <b>다시 읽어 확인</b>해.</p><div class="v71-controls"><button type="button" id="v72CheckPhotos" class="outline">CHECK PHOTO STORAGE</button><button type="button" id="v72RetryBackup" class="outline">RETRY FOLDER BACKUP</button><button type="button" id="v72DownloadFallback" class="outline">DOWNLOAD FULL JSON</button></div><div id="v72PhotoStatus" class="v72-report" role="status" aria-live="polite">사진 원본 확인은 CHECK PHOTO STORAGE를 눌러 시작해. 검사 중 사진을 삭제하거나 변경하지 않습니다.</div><div id="v72RecoveryStatus" class="v72-report" role="status" aria-live="polite">백업 실패 이력을 확인하는 중…</div><p>폴더 백업은 먼저 <b>임시 파일을 저장·검증</b>한 다음 새 이름의 전체 JSON을 작성·검증해. 검증되지 않은 파일은 정상 백업으로 표시하지 않습니다. 쓰기 중 실패하면 생성 중인 파일이 폴더에 남을 수 있으니 사용하지 마.</p><p>자동 재시도는 앱이 열려 있고 폴더 권한이 유지될 때만 최대 3회 제한적으로 수행해. iPhone·미지원 환경은 DOWNLOAD FULL JSON을 수동으로 이용해. 기기 바깥 클라우드 동기화는 제공하지 않습니다.</p></section><section class="v70-update"><div class="studio-tech-kicker">VERSION 7.0 / CONTROLLED APP UPDATES</div><h3>UPDATE WITHOUT RUSH.</h3><p>설치형 앱에서 새 버전이 발견되어도 작성 중인 화면을 자동으로 다시 열지 않습니다. 먼저 현재 기록과 사진을 검사하고, 전체 백업을 별도로 저장한 뒤 새 버전 적용을 선택해.</p><div id="v70UpdateStatus" class="v70-update-status" aria-live="polite">아직 업데이트 상태를 확인하지 않았어.</div><div class="v70-update-actions"><button type="button" class="outline" id="v70CheckUpdate">CHECK FOR UPDATE</button><button type="button" class="outline" id="v70CheckRecords">CHECK MY RECORDS</button><button type="button" class="outline" id="v70BackupNow">DOWNLOAD FULL BACKUP</button></div><label class="v70-update-consent"><input type="checkbox" id="v70BackupConfirmed"> <span>전체 백업 JSON을 내려받아 앱 밖에 보관했고, 사진 포함 여부도 확인했습니다.</span></label><button type="button" class="primary v70-apply" id="v70ApplyUpdate" disabled>APPLY READY UPDATE</button><p class="v70-note">이 기능은 같은 HTTPS 주소에 배포된 PWA의 <b>앱 코드 업데이트</b>를 제어해. HTML 파일에서 직접 실행하는 경우 사용할 수 없습니다. 서버에 개인 일기·사진을 업로드하지 않으며, 다른 기기와 동기화하지 않습니다. 기존 설치형 앱(v6.9)의 서비스 워커가 이미 즉시 활성화하도록 설정된 경우, v7.0으로 넘어오는 첫 업데이트는 이 새 승인 절차보다 먼저 진행될 수도 있습니다.</p></section><section class="v69-install"><div class="studio-tech-kicker">VERSION 6.9 / APP INSTALLATION</div><h3>MAKE IT YOUR APP.</h3><p>고정된 HTTPS 주소에서 실행하면 홈 화면에 설치하고, 한 번 접속한 뒤에는 앱 화면을 오프라인에서도 열 수 있습니다. 현재 HTML 파일을 직접 열면 설치형 PWA로 사용할 수 없습니다.</p><div class="v69-install-meta" id="v69InstallStatus" aria-live="polite">CHECK INSTALL STATUS를 눌러 실행 환경을 확인해.</div><div class="v69-install-actions"><button type="button" class="outline" id="v69CheckInstall">CHECK INSTALL STATUS</button><button type="button" class="outline" id="v69RequestStorage">REQUEST PERSISTENT STORAGE</button></div><p class="v69-install-note">중요: PWA를 설치해도 기기 간 동기화나 외부 자동 백업은 생기지 않습니다. 브라우저 및 설치된 앱의 저장 공간은 환경에 따라 달라질 수 있습니다. 설치 전후에 FULL BACKUP JSON을 별도로 보관하고 복원 결과를 확인하십시오.</p></section><div class="v61-transfer"><div class="studio-tech-kicker">VERSION 6.1 / UPGRADE SAFETY</div><h3>SAFE TRANSFER</h3><p>같은 저장 위치에서는 기존 앱 기록을 그대로 읽어. 다른 경로·브라우저·기기에서는 자동 이전을 보장할 수 없습니다. 이전 파일의 FULL BACKUP을 옮겨 확인하십시오.</p><button id="checkTransferV61" class="outline" type="button">CHECK CURRENT STORAGE</button><div id="transferSafetyV61" class="v60-report" aria-live="polite">검사 버튼을 누르면 현재 기록과 연결 관계를 읽기 전용으로 확인해.</div><p>브라우저가 Web Crypto를 지원하면 전체 백업에 SHA-256 검증값을 추가해. 복원 전에는 로컬 보호 스냅샷 생성을 시도하고, 실패하면 경고해. SHA-256이 없는 구버전 파일은 형식 검사 후 별도로 표시해.</p></div><div class="v60-audit"><div class="studio-tech-kicker">VERSION 6.1 / MIGRATION SAFETY</div><h3>UPGRADE CHECK</h3><p>전체 백업을 이용해 새 버전으로 옮기는 과정에서 사라지거나 바뀐 기록이 있는지 확인할 수 있습니다. 이 비교는 읽기 전용이며 원본·확정 감정·컬렉션·거래를 수정하지 않습니다.</p><div class="v60-origin">${originHelpV60()}</div><div class="v60-steps"><label class="v60-upload"><strong>01 BEFORE · 기존 전체 백업</strong><small>이전 버전에서 내보낸 FULL JSON</small><input id="v60BeforeFile" type="file" accept=".json,application/json"></label><label class="v60-upload"><strong>02 AFTER · 새 전체 백업 (선택)</strong><small>다른 파일과 비교할 때만 선택</small><input id="v60AfterFile" type="file" accept=".json,application/json"></label></div><div class="v60-buttons"><button id="v60CompareCurrent" type="button">BEFORE VS CURRENT</button><button id="v60CompareTwo" type="button">COMPARE TWO FILES</button><button id="downloadV60Audit" type="button" disabled>SAVE REPORT</button></div><div class="v60-report" id="v60AuditResult" aria-live="polite">검사할 백업을 선택해. 검사는 저장 데이터를 변경하지 않습니다.</div><p>주의: 이 검사는 데이터 항목과 값을 비교하지만 파일 간 사진 복원·브라우저 저장소의 물리적 내구성까지 보장하지는 않습니다.</p></div><h3>RULE VERSION COMPARISON</h3><p>이전에 게시한 분석 초안과 현재 게시본의 <b>자동 컬렉션·할 일·미확정 감정 후보</b>를 비교해. 감정 이력은 v6.5부터 기록해. 비교 이력은 최근 4개까지 보관하며 원문·사진·확정 정보는 저장하지 않습니다.</p><div class="v81-story-lab"><span class="studio-tech-kicker">VERSION 8.1 / READ-ONLY CHRONICLE</span><h3>STORY THREAD.</h3><p>긴 일기의 활동·계획·취소·다른 사람의 감정과 내가 느낀 감정을 <b>원문이 적힌 순서</b>로 살펴봐. 연결어는 원인 단서로만 표시하며 원본·확정 정보는 바꾸지 않습니다.</p><div class="v66-controls"><select id="storySelectV81" aria-label="스토리 흐름을 확인할 일기">${state.entries.filter(e=>e?.id&&e?.text?.trim()).sort((a,b)=>(b.text||'').length-(a.text||'').length).slice(0,50).map(e=>`<option value="${safe(e.id)}">${safe(e.date)} · ${safe((e.text||'').replace(/\s+/g,' ').slice(0,44))}</option>`).join('')}</select><button type="button" id="previewStoryV81">PREVIEW STORY</button></div><div id="storyResultV81" role="status" aria-live="polite">SELECT A RECORD · READ ONLY</div></div><div class="v64-compare-actions"><select id="versionCompareSelectV64" aria-label="이전 분석 버전 선택">${(state.reanalysisVersionsV64||[]).map((v,i)=>`<option value="${i}" ${i===state.reanalysisVersionsV64.length-2?'selected':''}>${safe(v.engine)} · ${safe((v.createdAt||'').slice(0,16))}</option>`).join('')}</select><button type="button" id="compareVersionsV64" class="outline">COMPARE PUBLISHED</button></div><div id="versionCompareResultV64" class="v64-compare-report" aria-live="polite">기존 분석을 게시한 이력이 있으면 비교할 수 있습니다. 게시 전 미리보기는 데이터를 변경하지 않습니다.</div></div><div class="studio-backup-row"><button id="exportBackup" class="outline">전체 백업 내보내기 ↗</button><label class="outline" for="importBackup" style="cursor:pointer">백업 가져오기<input id="importBackup" type="file" accept=".json,application/json" style="display:none"></label></div><div class="studio-backup-review"><label class="outline" for="inspectBackupInput" style="cursor:pointer">CHECK BACKUP<input id="inspectBackupInput" type="file" accept=".json,application/json" style="display:none"></label><p class="archive-backup-result" id="backupAuditResult" aria-live="polite"></p></div><p class="notice-small">백업에는 사적인 메모·사진·지출 정보가 포함될 수 있습니다. 가져오기는 기존 데이터를 교체해. 로컬 자동 스냅샷은 선택 기능이며 외부 자동 백업이 아닙니다. 다운로드한 전체 JSON을 별도로 보관하십시오.</p></section><div class="studio-settings-signoff">MY ARCHIVE — PERSONAL EDITION · V9.4.1</div></main>`;
 view.innerHTML=content;
 v90SimplifySettings();

const plannerSnap=15;

 }else{

 if(label)label.textContent=(carry?'CONT. · ':'')+clockString(start)+' — '+clockString(end%1440)+(end>=1440?' · +1D':'');

// Capture pointer events only while ADJUST is enabled so scrolling remains native otherwise.
document.addEventListener('pointerdown',e=>{
 if(!plannerEditMode||state.view!=='calendar'||state.calendarScale!=='day'||e.button!==0||activePlannerDrag)return;
 const node=e.target.closest('.timeline-event');
 if(!node||!node.closest('.planner-edit-enabled'))return;
 const key=node.dataset.editActivity;
 const a=scheduleFor(state.selected).find(block=>activityKey(block)===key);
 if(!a)return;
 const mode=e.target.closest('[data-resize-block]')?'resize':'move';
 const row=plannerRowHeight();
 const masterStart=a.masterStart??a.start,masterEnd=a.masterEnd??a.end;
 activePlannerDrag={pointerId:e.pointerId,node,key,event:a,mode,initialY:e.clientY,
   masterStart,masterEnd,nextMasterStart:masterStart,nextMasterEnd:masterEnd,moved:false,row};
 node.classList.add('is-dragging');

function finishPlannerDrag(e,cancel=false){

 }).filter(Boolean);

// v7.4 — read-only inventory of images in the archive. No photo deletion or writes.
let v74ScanGeneration=0,v74LastInventory=null,v74Scanning=false;
function v74Bytes(src){if(!isPhotoData(src))return 0;const encoded=src.slice(src.indexOf(',')+1);const pad=encoded.endsWith('==')?2:encoded.endsWith('=')?1:0;return Math.max(0,Math.floor(encoded.length*3/4)-pad)}
function v74Human(bytes){if(!Number.isFinite(bytes))return 'UNKNOWN';return bytes>=1048576?(bytes/1048576).toFixed(2)+' MiB':bytes>=1024?(bytes/1024).toFixed(1)+' KiB':bytes+' B'}
function v74Collect(){
 const found=new Map(),entries=Array.isArray(state.entries)?state.entries:[];
 const add=(value,date,kind)=>{
  if(!isPhotoRef(value)&&!isPhotoData(value))return;
  // Use the vault key for already-migrated image data, or the exact legacy data URL.
  const id=isPhotoRef(value)?value:(photoSourceRefs.get(value)||value);
  const item=found.get(id)||{ref:id,date:String(date||'').slice(0,10),kind,locations:[],linkedDates:new Set()};
  item.locations.push({date:String(date||'').slice(0,10),kind});
  if(/^\d{4}-\d{2}-\d{2}$/.test(date||''))item.linkedDates.add(date);
  found.set(id,item);
 };
 for(const e of entries){if(!e||!Array.isArray(e.images))continue;for(const img of e.images)add(img,e.date,'ATTACHMENT')}
 for(const [date,img] of Object.entries(state.photos||{}))add(img,date,'COVER');
 return [...found.values()];
}
function v74Stat(value,label){return '<div class="v74-stat"><b>'+safe(value)+'</b><small>'+safe(label)+'</small></div>'}
function v74Row(label,sub,bytes,date){return '<div class="v74-data-row"><div><strong>'+safe(label)+'</strong><small>'+safe(sub)+'</small></div><b>'+safe(v74Human(bytes))+'</b>'+(date?'<button type="button" data-v74-date="'+safe(date)+'">OPEN DATE</button>':'<span></span>')+'</div>'}
function v74PaintInventory(r){
 const el=document.getElementById('v74Results');if(!el)return;
 const rows=r.photos.slice().sort((a,b)=>b.bytes-a.bytes),days=new Map();
 for(const p of rows){for(const d of p.linkedDates){const old=days.get(d)||{date:d,bytes:0,count:0};old.bytes+=p.bytes;old.count++;days.set(d,old)}}
 const dayRows=[...days.values()].sort((a,b)=>b.bytes-a.bytes||a.date.localeCompare(b.date));
 const sum=r.totalBytes,estimated=r.usage===null?'UNAVAILABLE':v74Human(r.usage)+' / '+v74Human(r.quota),fraction=r.usage!==null&&r.quota>0?Math.round(100*r.usage/r.quota):null;
 const details=r.missing.length?'사진 '+r.missing.length+'개의 누락·손상 항목이 있습니다. 원본 전체 백업 복원 여부를 확인해.':'현재 기록이 참조한 이미지 데이터의 형식·존재 검사를 통과했습니다.';
 document.getElementById('v74Report').className='v74-report'+(r.missing.length?' is-error':fraction!==null&&fraction>=80?' is-warning':'');
 document.getElementById('v74Report').textContent='SCAN COMPLETE · 사진 용량 약 '+v74Human(sum)+' · 브라우저 전체 저장량 '+estimated+(fraction!==null?' ('+fraction+'%)':'')+'\n'+details+'\n총 '+r.photos.length+'개 고유 이미지 / '+r.references+'개 연결 / '+dayRows.length+'개 날짜 · 미사용 사진은 이 목록에 포함되지 않습니다.';
 el.innerHTML='<div class="v74-stats">'+v74Stat(String(r.photos.length),'고유 이미지')+v74Stat(String(r.references),'연결 횟수')+v74Stat(v74Human(sum),'사진 원본 추정')+v74Stat(String(dayRows.length),'사진 날짜')+v74Stat(String(r.missing.length),'사진 문제')+v74Stat(fraction===null?'N/A':fraction+'%','브라우저 전체 사용률')+'</div>'+
 '<div class="v74-data-group"><h4>HEAVIEST DATES</h4>'+(dayRows.length?dayRows.slice(0,12).map((x,i)=>v74Row(x.date,`${x.count} unique photos · TOP ${i+1}`,x.bytes,x.date)).join(''):'<p class="v74-note">날짜가 연결된 사진이 없습니다.</p>')+'</div>'+
 '<div class="v74-data-group"><h4>LARGEST IMAGES</h4>'+(rows.length?rows.slice(0,15).map((x,i)=>v74Row('PHOTO '+String(i+1).padStart(2,'0'),x.kind+' · '+x.locations.length+' links · '+(x.date||'DATE UNKNOWN')+(x.missing?' · MISSING':''),x.bytes,/^\d{4}-\d{2}-\d{2}$/.test(x.date)?x.date:null)).join(''):'<p class="v74-note">사진이 없습니다.</p>')+'</div>';
}
async function v74Scan(){
 if(v74Scanning)return;
 const el=document.getElementById('v74Report'),btn=document.getElementById('v74Scan'),cancel=document.getElementById('v74Cancel'),download=document.getElementById('v74Download');
 const generation=++v74ScanGeneration;v74Scanning=true;v74LastInventory=null;
 if(btn)btn.disabled=true;if(cancel)cancel.disabled=false;if(download)download.disabled=true;
 if(el){el.className='v74-report';el.textContent='사진 목록을 확인하는 중…'}
 try{
  const list=v74Collect(),photos=[],missing=[];let totalBytes=0,references=0;
  for(let i=0;i<list.length;i++){
   if(generation!==v74ScanGeneration)throw Error('검사를 중단했습니다. 기존 데이터에는 영향이 없습니다.');
   const item=list[i];let source=isPhotoData(item.ref)?item.ref:null;
   if(isPhotoRef(item.ref)){
    if(!photoVaultEnabled||!photoDb){missing.push(i);source=null}
    else{try{source=await photoDbGet(item.ref)}catch(_){source=null}}
   }
   const valid=isPhotoData(source)&&v73PhotoSyntax(source);
   const bytes=valid?v74Bytes(source):0;
   if(!valid&&!missing.includes(i))missing.push(i);
   totalBytes+=bytes;references+=item.locations.length;
   photos.push({date:item.date,kind:item.kind,bytes,missing:!valid,locations:item.locations,linkedDates:[...item.linkedDates]});
   // Let the page update during long vault reads. Avoid retaining image payloads in the report.
   if(i%12===0){if(el)el.textContent='SCANNING PHOTOS · '+(i+1)+' / '+list.length;await new Promise(resolve=>setTimeout(resolve,0))}
  }
  let usage=null,quota=null;
  if(navigator.storage&&typeof navigator.storage.estimate==='function'){
   try{const estimate=await navigator.storage.estimate();usage=Number.isFinite(estimate.usage)?estimate.usage:null;quota=Number.isFinite(estimate.quota)?estimate.quota:null}catch(_){}
  }
  if(generation!==v74ScanGeneration)throw Error('검사를 중단했습니다.');
  const result={photos,totalBytes,references,missing,usage,quota,checkedAt:new Date().toISOString()};
  v74LastInventory=result;v74PaintInventory(result);if(download)download.disabled=false;
 }catch(error){if(el){el.className='v74-report is-error';el.textContent='PHOTO SPACE CHECK STOPPED · '+(error?.message||String(error))}}
 finally{v74Scanning=false;if(btn)btn.disabled=false;if(cancel)cancel.disabled=true}
}
function v74Export(){
 const r=v74LastInventory;if(!r)return;
 const cells=[['date','kind','link_occurrences','approx_bytes','status']];
 for(const p of r.photos){for(const d of p.linkedDates.length?p.linkedDates:[''])cells.push([d,p.kind,p.locations.filter(loc=>loc.date===d).length,p.bytes,p.missing?'MISSING':'OK'])}
 // No diary text, image bytes, photos, or personally generated record IDs in this lightweight report.
 const csv='\uFEFF'+cells.map(row=>row.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='my_archive_photo_space_v74.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
document.addEventListener('click',event=>{
 if(event.target.closest('#v74Scan')){void v74Scan();return}
 if(event.target.closest('#v74Cancel')){if(v74Scanning){v74ScanGeneration++;const el=document.getElementById('v74Report');if(el)el.textContent='STOP REQUESTED · 기록과 사진은 변경되지 않았어.'}return}
 if(event.target.closest('#v74Download')){v74Export();return}
 if(event.target.closest('#v74FullBackup')){document.getElementById('exportBackup')?.click();return}
 const jump=event.target.closest('[data-v74-date]');if(jump){const date=jump.dataset.v74Date;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;set({view:'calendar',selected:date,month:date.slice(0,7),calendarScale:'day',dayDetailsOpen:false});window.scrollTo(0,0)}
});

</script><script id="v69-pwa-support">
(()=>{'use strict';
const isHosted=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
const label=document.getElementById.bind(document);
const human=b=>!Number.isFinite(b)?'확인 불가':(b/1024/1024).toFixed(1)+' MB';
async function check(){
 const lines=[];
 lines.push('접속 위치 · '+(location.protocol==='file:'?'LOCAL HTML FILE':location.origin));
 lines.push('안전한 접속(HTTPS/localhost) · '+(window.isSecureContext?'YES':'NO'));
 lines.push('설치용 파일(Manifest) · '+(isHosted?'검사 중…':'HTML 단독 실행에서는 사용 불가'));
 if(isHosted){try{const response=await fetch('./manifest.webmanifest',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const manifest=await response.json();lines[2]='설치용 파일(Manifest) · '+(manifest.name?'READY':'INVALID');}catch(e){lines[2]='설치용 파일(Manifest) · NOT FOUND';}}
 if('serviceWorker' in navigator&&isHosted){try{const reg=await navigator.serviceWorker.getRegistration();lines.push('오프라인 앱 실행 · '+(reg?.active?'SERVICE WORKER ACTIVE':'NOT ACTIVE YET'));}catch(e){lines.push('오프라인 앱 실행 · CHECK FAILED');}}else lines.push('오프라인 앱 실행 · NOT AVAILABLE');
 if(navigator.storage?.estimate){try{const s=await navigator.storage.estimate();lines.push('현재 저장 사용량 · '+human(s.usage)+' / 예상 한도 '+human(s.quota));}catch(e){lines.push('저장량 · 조회할 수 없음');}}
 if(navigator.storage?.persisted){try{lines.push('저장 공간 보존 요청 상태 · '+((await navigator.storage.persisted())?'GRANTED':'NOT GRANTED'));}catch(e){}}
 lines.push('기기 간 동기화 · NOT IMPLEMENTED');
 const target=label('v69InstallStatus');if(target)target.textContent=lines.join('\n');
 return lines;
}
document.addEventListener('click',async e=>{
 if(e.target.closest('#v69CheckInstall')){await check();return;}
 if(e.target.closest('#v69RequestStorage')){
  const target=label('v69InstallStatus');
  if(!window.isSecureContext||!navigator.storage?.persist){if(target)target.textContent='이 환경에서는 저장 공간 보존을 요청할 수 없습니다. 전체 JSON을 별도 저장하십시오.';return;}
  try{const ok=await navigator.storage.persist();await check();if(target)target.textContent+='\n보존 요청 결과 · '+(ok?'GRANTED':'NOT GRANTED · 브라우저가 거절했거나 지원하지 않음');}
  catch(err){if(target)target.textContent='저장 공간 보존 요청 실패: '+(err?.message||'알 수 없는 오류');}
 }
});
if('serviceWorker' in navigator&&isHosted){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(err=>{console.warn('[MY ARCHIVE] PWA offline registration unavailable:',err.message);});});}
})();
</script><script id="v70-update-control">(()=>{'use strict';
const hostable=location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname);
let waiting=null,recordCheckOK=false,applying=false;
const $=id=>document.getElementById(id);
function status(message){if($('v70UpdateStatus'))$('v70UpdateStatus').textContent=message;}
function syncButton(){const btn=$('v70ApplyUpdate');if(btn)btn.disabled=!(hostable&&waiting&&recordCheckOK&&$('v70BackupConfirmed')?.checked);}
function lookupWorker(reg){return reg?.waiting||null;}
async function updateCheck(){
 if(!hostable||!('serviceWorker' in navigator)){waiting=null;status('LOCAL HTML / 지원되지 않는 접속 환경. PWA 업데이트는 고정 HTTPS 주소에서만 사용할 수 있습니다.');syncButton();return;}

 await reg.update();waiting=lookupWorker(reg);
 status(waiting?'NEW APP VERSION READY · 적용 전에 FULL BACKUP을 별도 저장하고 CHECK MY RECORDS를 실행해.':'NO WAITING UPDATE · 현재 적용을 기다리는 새 버전이 없습니다. (서버에 새 파일이 올라왔는지는 별도 확인 필요)');syncButton();}

 status((r.healthy?'RECORD CHECK PASSED':'RECORD CHECK NEEDS ATTENTION')+' · 원본 '+r.entries+'개 · 확정 감정 '+r.confirmed+'개 · 사진 첨부 '+r.photos+'개 · 중복 ID '+r.duplicate+'개 · 잘못된 기록 '+r.invalid+'개\nPHOTO · '+r.photoStatus+'\n검사 결과는 외부에 저장되지 않습니다.');syncButton();}
 catch(e){recordCheckOK=false;status('RECORD CHECK FAILED · '+(e?.message||'알 수 없음'));syncButton();}

 applying=true;const btn=$('v70ApplyUpdate');if(btn)btn.disabled=true;
 try{waiting.postMessage({type:'MY_ARCHIVE_ACTIVATE_UPDATE'});status('업데이트 활성화를 요청했습니다. 새 서비스 워커가 활성화되면 화면을 다시 열어.');}
 catch(e){applying=false;status('업데이트 요청 실패 · '+e.message);syncButton();}
}
document.addEventListener('click',e=>{if(e.target.closest('#v70CheckUpdate')){void updateCheck();return;}if(e.target.closest('#v70CheckRecords')){recordCheck();return;}if(e.target.closest('#v70BackupNow')){backupClick();return;}if(e.target.closest('#v70ApplyUpdate')){applyUpdate();}});
